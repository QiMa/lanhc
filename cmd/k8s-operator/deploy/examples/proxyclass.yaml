apiVersion: lanhc.com/v1alpha1
kind: ProxyClass
metadata:
  name: prod
spec:
  metrics:
    enable: true
  statefulSet:
    annotations:
      platform-component: infra
    pod:
      labels:
        team: eng
      nodeSelector:
        kubernetes.io/os: "linux"
      imagePullSecrets:
      - name: "foo"
      lanhcContainer:
        image: "ghcr.io/lanhc/lanhc:v1.64"
        imagePullPolicy: IfNotPresent
      lanhcInitContainer:
        image: "ghcr.io/lanhc/lanhc:v1.64"
        imagePullPolicy: IfNotPresent
